name: Update Live Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Pull fresh Yahoo Finance snapshot & rebuild HTML
        run: python build_html.py

      - name: Commit & push updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-movers.html docs/ public/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh live market snapshot"
            git push
          fi
